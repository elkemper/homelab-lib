name: ci
on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build:server
      - run: npm run build:client
        env:
          NODE_OPTIONS: --max_old_space_size=4096
      - run: npm test
        env:
          # Unit tests import server config, which has no insecure fallbacks:
          # dummy values so generateToken/startupChecks see a present secret.
          JWT_SECRET: ci-unit-test-secret
          ADMIN_USERNAME: ciadmin
          ADMIN_PASSWORD: ciadminpass123
          DB_PATH: ':memory:'
      - run: npm run test:client

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Only the test driver deps: the app itself builds inside Docker.
      - run: npm --prefix packages/tests ci
      - run: command -v sqlite3 && command -v zip || sudo apt-get install -y sqlite3 zip
      - run: TARGET=compose ./scripts/e2e.sh
